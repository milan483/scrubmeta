[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scrubmeta"
version = "0.1.0"
description = "Offline scanner and cleaner for selected embedded file metadata"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["defusedxml>=0.7.1", "pikepdf>=9"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/milan483/scrubmeta"
Issues = "https://github.com/milan483/scrubmeta/issues"

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12", "Pillow>=11"]

[project.scripts]
scrubmeta = "scrubmeta.cli:main"

[tool.setuptools]
packages = ["scrubmeta"]

[tool.ruff]
target-version = "py311"
