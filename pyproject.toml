[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scrubmeta"
version = "0.1.0"
description = "Offline scanner and cleaner for selected embedded file metadata"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["defusedxml>=0.7.1", "pikepdf>=9"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12", "Pillow>=11"]

[project.scripts]
scrubmeta = "scrubmeta.cli:main"

[tool.setuptools]
packages = ["scrubmeta"]

[tool.ruff]
target-version = "py311"
