name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install ExifTool on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl
      - name: Install ExifTool on Windows
        if: runner.os == 'Windows'
        run: choco install exiftool -y --no-progress
      - run: exiftool -ver
      - run: python -m pip install ".[test]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: scrubmeta --help

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install and smoke-test the built wheel
        working-directory: ${{ runner.temp }}
        env:
          DIST_DIR: ${{ github.workspace }}/dist
        run: |
          python -m venv wheel-env
          wheel-env/bin/python -m pip install "$DIST_DIR"/*.whl
          wheel-env/bin/scrubmeta --help
          wheel-env/bin/python -m scrubmeta --help
